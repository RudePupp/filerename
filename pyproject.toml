[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filerename"
version = "0.1.0"
description = "Rename files by replacing spaces with underscores"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "filerename"}]
dependencies = ["click>=8.0"]

[project.scripts]
filerename = "filerename.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
